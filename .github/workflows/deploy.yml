name: Deploy site

# Source of truth: this pipeline builds from a pinned checkout of the ref that
# triggered it (main push = production). No session-workspace deploys.
#
# Required repo secrets (Settings > Secrets > Actions):
#   SURGE_LOGIN / SURGE_TOKEN  - static production deploy (reemco-price-compare-preview.surge.sh)
#   VERCEL_TOKEN (+ VERCEL_ORG_ID / VERCEL_TEAM_ID) - optional server-render path
#     (needed for F2 response headers: CSP, nosniff, Referrer-Policy; Surge
#     static hosting cannot emit custom headers).
#
# Rollback: run this workflow manually (Actions > Deploy site > Run workflow)
# with `rollback_sha` set to the previous known-good commit; it rebuilds from
# that exact SHA and republishes. Rollback = redeploy of the prior artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy (rollback). Empty = default branch."
        required: false
        default: ""
      smoke_fixture_query:
        description: "Override the smoke-check fixture query (deliberately bad query = demonstrates a failed smoke check)."
        required: false
        default: ""

permissions:
  contents: read # checkout needs this; specifying any workflow-level permissions revokes the defaults
  issues: write # deploy/smoke failure alerts

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stamp the artifact with its source commit so the deployed build is
      # self-identifying: https://<host>/__commit.txt
      - name: Stamp commit into build
        run: echo "${{ inputs.rollback_sha || github.sha }}" > public/__commit.txt

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Static export (./out) is the production artifact for Surge; the plain
      # server build leaves no ./out and the Surge step fails on it.
      - run: npm run build:static

      - name: Deploy static export to Surge (production)
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          if [ -z "$SURGE_LOGIN" ] || [ -z "$SURGE_TOKEN" ]; then
            echo "::error::Repo secrets SURGE_LOGIN/SURGE_TOKEN are not set - cannot deploy. Unblock owner: repo admin (CEO)."
            exit 1
          fi
          npx surge ./out reemco-price-compare-preview.surge.sh --token "$SURGE_TOKEN"

      # Post-deploy smoke check: live artifact must serve the commit we built.
      - name: Post-deploy artifact check
        run: |
          sleep 5
          SERVED=$(curl -fsS https://reemco-price-compare-preview.surge.sh/__commit.txt 2>/dev/null | tr -d '[:space:]')
          echo "live artifact commit: $SERVED"
          if [ "$SERVED" != "${{ inputs.rollback_sha || github.sha }}" ]; then
            echo "::error::Deployed artifact does not match built commit ($SERVED != ${{ inputs.rollback_sha || github.sha }})"
            exit 1
          fi

      # REEA-44 post-deploy funnel smoke check (CEO P0: nothing new ships until
      # the deployed site is proven working after every deploy).
      # Verifies: (1) home loads, (2) fixture query returns result cards,
      # (3) a card has a working click-out link. Deterministic: the fixture
      # query hits the seeded catalog shipped in the bundle, never fresh data.
      # Exit 1 names the failed step; the alert step below opens an issue.
      - name: Post-deploy funnel smoke check (home → search → click-out)
        env:
          SMOKE_BASE_URL: https://reemco-price-compare-preview.surge.sh
          SMOKE_FIXTURE_QUERY: ${{ inputs.smoke_fixture_query }}
        run: npm run smoke

      # Failure signal: open a deduped issue naming the failed step so the
      # deploy failure surfaces immediately in the notification stream.
      - name: Alert on deploy/smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deploy-alert --color D93F0B --description "Post-deploy deploy/smoke check failure" --force || true
          sleep 10 # job records settle before we query them
          FAILED_STEPS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join("; ")')
          BODY="Deploy pipeline failed at $(date -u +%FT%TZ).
          Failed step(s): ${FAILED_STEPS:-unknown}.
          Commit: ${{ inputs.rollback_sha || github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If the failed step is the funnel smoke check, the deployed site did NOT pass home → search → click-out and the deploy must be treated as failed (rollback: rerun this workflow with rollback_sha set to the last green commit)."
          if gh issue list --label deploy-alert --state open --json url -q '.[0].url' | grep -q .; then
            gh issue comment "$(gh issue list --label deploy-alert --state open --json number -q '.[0].number')" \
              --body "$BODY"
          else
            gh issue create --title "DEPLOY ALERT: post-deploy check failed — $FAILED_STEPS" \
              --label deploy-alert --body "$BODY"
          fi

  # Optional server-render deploy (unblocks F2 response headers once VERCEL_TOKEN exists).
  vercel-server:
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel (production, server render)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set - skipping server-render deploy. F2 headers remain gated on this secret. Owner: CEO/repo admin."
            exit 0
          fi
          npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
