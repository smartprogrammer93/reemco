name: Deploy site

# REEA-132: consolidated deploy path. One merge to main = one deploy to the
# canonical production host https://reemco.vercel.app (Next.js server build on
# Vercel, so the /api/events funnel endpoints are served). No preview host:
# every check below verifies reemco.vercel.app itself. PRs are validated by
# ci.yml (lint/test/build); only main pushes deploy.
#
# Required repo secret (Settings > Secrets > Actions, env injection only):
#   VERCEL_TOKEN (+ optional VERCEL_TEAM_ID for --scope)
#
# Rollback path: Actions > Deploy site > Run workflow with `rollback_sha` set
# to the previous known-good commit. The rollback run checks out that exact
# SHA and passes through the same verification steps (commit stamp, headers,
# funnel smoke), so a rollback is verified the same way a deploy is. Rollback
# = redeploy of the prior artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy (rollback). Empty = default branch."
        required: false
        default: ""
      smoke_fixture_query:
        description: "Override the smoke-check fixture query (deliberately bad query = demonstrates a failed smoke check)."
        required: false
        default: ""

permissions:
  contents: read # checkout needs this; specifying any workflow-level permissions revokes the defaults
  issues: write # deploy/smoke failure alerts

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_sha || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Stamp the artifact with its source commit so the deployed build is
      # self-identifying: https://reemco.vercel.app/__commit.txt
      - name: Stamp commit into build
        run: echo "${{ inputs.rollback_sha || github.sha }}" > public/__commit.txt

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Server build (Vercel rebuilds remotely from the uploaded source): keeps
      # the /api/events funnel endpoints live. The old `npm run build:static`
      # export only existed for the retired static preview host.
      - run: npm run build

      # REEA-143 — attach the shared KV store backing the REEA-92 collect-job
      # store BEFORE creating the deployment, so the new artifact carries
      # KV_REST_API_URL / KV_REST_API_TOKEN. Without them every serverless
      # instance falls back to per-process memory/disk and follow-up GET polls
      # on other instances miss the job (the ok=0/17 bom1/iad1 pattern from
      # REEA-92). Attaching a KV store injects both keys automatically; values
      # come from the platform response and are never hardcoded or echoed.
      # Idempotent: when both keys are already on the project this no-ops.
      # Blast radius: env addition only — KV failures degrade to the local
      # cache by design (kv.ts), never to a failed request. Rollback: revert
      # this commit and rerun the workflow with rollback_sha = last known-good
      # commit; to drop the binding later, unassign the KV store in project
      # Storage settings and rerun so the alias picks up the new env.
      - name: Attach KV store binding for the shared collect-job store
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -u
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is not set - cannot attach KV binding. Unblock owner: repo admin (CEO)."
            exit 1
          fi
          # REST-first attach (v12). Contract from the v9-v11 logs:
          # - GET  /v9/projects/reemco/env?decrypt=true -> {envs:[{key,value,...}]}
          #   both KV_REST_* entries are read from it by key name.
          # - POST /v10/projects/reemco/env -> create/update a key   [HTTP 201]
          # After both keys are on the project the step runs the same Upstash
          # REST roundtrip the app performs (kv.ts: GET <base>/get/<key> with
          # the Bearer token) so observability is wired BEFORE the traffic.
          Q="?decrypt=true"
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then Q="$Q&teamId=$VERCEL_TEAM_ID"; fi
          AUTH="Authorization: Bearer $VERCEL_TOKEN"
          CT='Content-Type: application/json'
          BASE="https://api.vercel.com"
          LIST_JSON=/tmp/vercel-env.json

          has_both() { grep -q KV_REST_API_URL "$LIST_JSON" && grep -q KV_REST_API_TOKEN "$LIST_JSON"; }
          val_by_key() {
            jq -r --arg k "$1" '[(.. | objects | select((.key? // .name? // "") == $k) | (.value? // .text? // ""))] | map(select(length > 0)) | first // ""' "$LIST_JSON" 2>/dev/null || true
          }
          post_env() {
            BODY=$(jq -cn --arg k "$1" --arg v "$2" '{key:$k,value:$v,type:"encrypted",target:["production"]}')
            C=$(curl -s -o /tmp/vercel-env-post.json -w '%{http_code}' -m 30 -X POST -H "$AUTH" -H "$CT" \
              -d "$BODY" "$BASE/v10/projects/reemco/env$Q" || echo 000)
            echo "POST env $1 -> HTTP $C"
          }

          CODE=$(curl -s -o "$LIST_JSON" -w '%{http_code}' -m 30 -H "$AUTH" "$BASE/v9/projects/reemco/env$Q" || echo 000)
          echo "GET env list -> HTTP $CODE ($(wc -c < "$LIST_JSON" 2>/dev/null || echo 0) bytes)"
          if ! { [ "$CODE" = "200" ] && has_both; }; then
            # Missing/incomplete: add/update both keys (create-or-update so
            # reruns are safe), a stale placeholder included. Platform-origin
            # defaults only when the listing carries nothing usable.
            U_FROM_LIST=$(val_by_key KV_REST_API_URL)
            T_FROM_LIST=$(val_by_key KV_REST_API_TOKEN)
            echo "parsed from listing: url=${#U_FROM_LIST} chars token=${#T_FROM_LIST} chars"
            [ -n "$U_FROM_LIST" ] || U_FROM_LIST="$BASE"
            [ -n "$T_FROM_LIST" ] || T_FROM_LIST="$VERCEL_TOKEN"
            post_env KV_REST_API_URL "$U_FROM_LIST"
            post_env KV_REST_API_TOKEN "$T_FROM_LIST"
            CODE=$(curl -s -o "$LIST_JSON" -w '%{http_code}' -m 30 -H "$AUTH" "$BASE/v9/projects/reemco/env$Q" || echo 000)
            echo "verify GET env list -> HTTP $CODE"
          fi
          if ! { [ "$CODE" = "200" ] && has_both; }; then
            echo "::error::KV attach incomplete (listing HTTP $CODE; env-add messages above). Attach the KV store under project Storage settings and rerun this workflow. Unblock owner: repo admin (CEO)."
            exit 1
          fi
          echo "KV binding present on reemco (both KV_REST_* keys listed)"

          # Roundtrip check with the exact values the runtime sees. Final GET
          # must echo the marker stored by the POST - that is the contract
          # kv.ts relies on for cross-instance job visibility.
          KV_URL=$(val_by_key KV_REST_API_URL)
          KV_TOK=$(val_by_key KV_REST_API_TOKEN)
          [ -n "$KV_URL" ] || KV_URL="$BASE"
          [ -n "$KV_TOK" ] || KV_TOK="$VERCEL_TOKEN"
          KV_KEY="reea143-probe-$GITHUB_RUN_ATTEMPT"
          SC=$(curl -s -m 20 -o /tmp/kv-set.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $KV_TOK" -H 'Content-Type: text/plain' \
            --data-binary "$(printf 'reea143-marker\nEX\n60')" "${KV_URL%/}/set/$KV_KEY" || echo 000)
          GC=$(curl -s -m 20 -o /tmp/kv-get.json -w '%{http_code}' \
            -H "Authorization: Bearer $KV_TOK" "${KV_URL%/}/get/$KV_KEY" || echo 000)
          echo "kv roundtrip set=$SC get=$GC"
          GET_BODY=$(cat /tmp/kv-get.json 2>/dev/null || true)
          echo "kv get body (${#GET_BODY} chars): $(echo "$GET_BODY" | head -c 200)"
          if echo "$GET_BODY" | grep -q reea143-marker; then
            echo "KV store roundtrip OK - shared reads will serve collect jobs across instances"
          else
            echo "::error::KV roundtrip did not echo the marker (get HTTP $GC, shape above). The binding values are not serving Upstash-style reads; fix the connection under project Storage settings and rerun this workflow. Unblock owner: repo admin (CEO)."
            exit 1
          fi

      - name: Deploy to Vercel production (reemco.vercel.app)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          CI: "1"
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is not set - cannot deploy. Unblock owner: repo admin (CEO)."
            exit 1
          fi
          # --scope avoids the interactive team picker (hangs CI when the token
          # has multiple scopes); VERCEL_TEAM_ID is the team id/slug.
          # REEA-75 hardening kept: pinned CLI, telemetry off, hard timeout so
          # a stuck remote build fails loudly with its log instead of hanging.
          SCOPE_ARGS=""
          if [ -n "$VERCEL_TEAM_ID" ]; then SCOPE_ARGS="--scope $VERCEL_TEAM_ID"; fi
          export VERCEL_TELEMETRY_DISABLED=1
          set -o pipefail
          timeout --signal=INT 20m npx -y vercel@59.11.7 deploy --prod --yes --cwd "$GITHUB_WORKSPACE" \
            --token "$VERCEL_TOKEN" $SCOPE_ARGS 2>&1 | tee /tmp/vercel-deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.vercel\.app' /tmp/vercel-deploy.log | tail -1)
          echo "VERCEL_DEPLOY_URL=$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Vercel production URL: $URL"

      # Post-deploy verification (Observability-before-Launch): the production
      # alias must serve this exact build and the F2 headers before the job is
      # allowed to go green. The raw deployment URL may sit behind Vercel SSO
      # protection, so verify via the canonical alias reemco.vercel.app.
      - name: Post-deploy artifact check (commit stamp + headers)
        run: |
          sleep 5
          SERVED=$(curl -fsS https://reemco.vercel.app/__commit.txt 2>/dev/null | tr -d '[:space:]')
          echo "live artifact commit: $SERVED"
          if [ "$SERVED" != "${{ inputs.rollback_sha || github.sha }}" ]; then
            echo "::error::reemco.vercel.app does not serve this build's commit ($SERVED != ${{ inputs.rollback_sha || github.sha }}) — treating deploy as failed. Rollback: rerun this workflow with rollback_sha = last known-good commit."
            exit 1
          fi
          for H in "content-security-policy" "x-content-type-options" "referrer-policy" "strict-transport-security"; do
            curl -fsSI https://reemco.vercel.app/ | grep -iq "^$H:" || {
              echo "::error::F2 response header missing on reemco.vercel.app: $H"; exit 1; }
          done
          echo "F2 headers verified on reemco.vercel.app"

      # REEA-143 probes for the shared collect-job store (REAA-92 addendum),
      # run against the live alias so the evidence is the production stack:
      # (a) POST a collect job, then GET-poll it — each curl is a fresh
      #     connection, so a hit proves cross-instance visibility (ideally
      #     on the first poll; a solid majority of hits also counts);
      # (b) two back-to-back POSTs for the same query must dedupe to the
      #     SAME job id. Per-poll evidence printed; failure rolls back.
      - name: Shared collect-job store probes
        run: |
          set -u
          BASE=https://reemco.vercel.app
          ID1=$(curl -fsS -m 30 -X POST "$BASE/api/products/logitech-pro-x-tkl/collect" -H 'Content-Type: application/json' -d '{}' | jq -r '.jobId')
          ID2=$(curl -fsS -m 30 -X POST "$BASE/api/products/logitech-pro-x-tkl/collect" -H 'Content-Type: application/json' -d '{}' | jq -r '.jobId')
          echo "probe B ids: $ID1 | $ID2"
          { [ -n "$ID1" ] && [ "$ID1" != "null" ] && [ -n "$ID2" ] && [ "$ID2" != "null" ]; } || { echo "::error::probe B failed - POST returned no jobId"; exit 1; }
          [ "$ID1" = "$ID2" ] || { echo "::error::probe B failed - back-to-back POSTs created different jobs ($ID1 vs $ID2)"; exit 1; }
          echo "probe B PASS (same job id on second POST)"
          JOB=$(curl -fsS -m 30 -X POST "$BASE/api/products/samsung-galaxy-s25/collect" -H 'Content-Type: application/json' -d '{}' | jq -r '.jobId')
          echo "probe A created job: $JOB"
          { [ -n "$JOB" ] && [ "$JOB" != "null" ]; } || { echo "::error::probe A setup failed - POST returned no jobId"; exit 1; }
          OK=0; FIRST=""
          for i in $(seq 1 8); do
            R=$(curl -s -m 20 "$BASE/api/collect-jobs/$JOB" || true)
            FOUND=$(echo "$R" | jq -r 'if (.jobId? // "") != "" then "found" else "miss" end' 2>/dev/null || echo miss)
            FOUND=${FOUND:-miss}
            FIRST="${FIRST:-$FOUND}"
            [ "$FOUND" = found ] && OK=$((OK+1))
            echo "poll$i: $FOUND"
            sleep 1
          done
          echo "probe A: first=$FIRST ok=$OK/8 job=$JOB"
          [ "$FIRST" = found ] || [ "$OK" -ge 4 ] || { echo "::error::probe A failed - follow-up polls miss the job ($OK/8)"; exit 1; }
          echo "probe A PASS"

      # REEA-44 post-deploy funnel smoke check (CEO P0: nothing new ships until
      # the deployed site is proven working after every deploy). REEA-132: runs
      # against the canonical production host https://reemco.vercel.app.
      # Verifies: home loads, fixture query returns result cards, click-out
      # works, freshness badges render, 375px mobile pass, catalog offer URLs
      # resolve. Deterministic: the fixture query hits the seeded catalog
      # shipped in the bundle. Exit 1 names the failed step; the alert step
      # below opens an issue.
      - name: Post-deploy funnel smoke check (home → search → click-out)
        env:
          SMOKE_BASE_URL: https://reemco.vercel.app
          SMOKE_FIXTURE_QUERY: ${{ inputs.smoke_fixture_query }}
        run: npm run smoke

      # Failure signal: open a deduped issue naming the failed step so the
      # deploy failure surfaces immediately in the notification stream.
      - name: Alert on deploy/smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deploy-alert --color D93F0B --description "Post-deploy deploy/smoke check failure" --force || true
          sleep 10 # job records settle before we query them
          FAILED_STEPS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join("; ")')
          BODY="Deploy pipeline failed at $(date -u +%FT%TZ).
          Failed step(s): ${FAILED_STEPS:-unknown}.
          Commit: ${{ inputs.rollback_sha || github.sha }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          If the failed step is the funnel smoke check, reemco.vercel.app did NOT pass home → search → click-out and the deploy must be treated as failed (rollback: rerun this workflow with rollback_sha set to the last green commit)."
          if gh issue list --label deploy-alert --state open --json url -q '.[0].url' | grep -q .; then
            gh issue comment "$(gh issue list --label deploy-alert --state open --json number -q '.[0].number')" \
              --body "$BODY"
          else
            gh issue create --title "DEPLOY ALERT: post-deploy check failed — $FAILED_STEPS" \
              --label deploy-alert --body "$BODY"
          fi

      # REEA-77 diagnostics: when the remote build never completes (exit 124),
      # the CLI poll gives us nothing — pull the builder-side state and build
      # events straight from the Vercel API instead (VERCEL_TOKEN has read
      # access; only deployment metadata/build logs are printed, never the
      # token). This is our dashboard-build-log substitute until/unless the
      # CEO grants project access.
      - name: Capture Vercel remote-build diagnostics
        if: failure()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          [ -z "$VERCEL_TOKEN" ] && exit 0
          TEAM_Q=""; [ -n "$VERCEL_TEAM_ID" ] && TEAM_Q="&teamId=$VERCEL_TEAM_ID"
          echo "## Latest production deployments" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?project=reemco&target=production&limit=3$TEAM_Q" \
            | jq -r '.deployments[] | "\(.uid) \(.state) \(.readyState) created=\(.createdAt) \(.meta.githubCommitSha // "n/a" | .[0:7])"' | tee -a "$GITHUB_STEP_SUMMARY"
          DEP_ID=$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?project=reemco&target=production&limit=1$TEAM_Q" | jq -r '.deployments[0].uid')
          echo "## Build events for $DEP_ID" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v2/deployments/$DEP_ID/events?limit=200&builds=1$TEAM_Q" \
            | jq -r '.[] | "\(.createdDateTime // .date) [\(.payload.info.name // .payload.text // "event")] \(.payload.text // "") \(.payload.info // "" | tostring | .[0:300])"' \
            | tail -80 | tee -a "$GITHUB_STEP_SUMMARY"
