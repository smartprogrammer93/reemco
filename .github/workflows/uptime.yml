name: Uptime check


  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    # REEA-314: stays GitHub-hosted — curl-only job (~10s/run, no checkout, no
    # node install), tens of minutes per month in total, and availability
    # monitoring must not depend on the self-hosted runner being online.
    # timeout-minutes bounds a stuck probe; concurrency drops queued overlaps.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: uptime-probe
      cancel-in-progress: true
    steps:
      - name: Probe public URL
        id: probe
        run: |
          BASE="https://reemco.vercel.app"
          FAIL=""
          # REEA-371: budget must sit above the measured funnel walk, not below
          # it. Cold-ish arrivals walk home + staged results + product hops in
          # ~30s (measured 04:20-06:10Z); with --max-time 15 the probe false-
          # failed on healthy-but-walking requests since ~02:18Z. Same reason
          # the smoke-check hop budgets were widened in REEA-369: monitoring
          # ceilings stricter than the thing they observe burn error budget on
          # noise (MTTR). Keep-warm's own ping already uses --max-time 60.
          for CHECK in "/" "/search" "/results?q=iPhone%2017%20Pro"; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 "$BASE$CHECK" || echo 000)
            echo "$CHECK -> $CODE"
            case "$CODE" in 200|301|302) ;; *) FAIL="$FAIL $CHECK($CODE)";; esac
          done
          echo "failed=$FAIL" >> "$GITHUB_OUTPUT"
          [ -z "$FAIL" ] || exit 1

      - name: Open deduped downtime issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh issue list --label uptime-alert --state open --json url -q '.[0].url' | grep -q .; then
            echo "open uptime-alert issue already exists - appending"
          else
            gh issue create \
              --title "UP ALERT: public site failing uptime probe" \
              --label uptime-alert \
              --body "Uptime probe failed at $(date -u +%FT%TZ) for: ${{ steps.probe.outputs.failed }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
