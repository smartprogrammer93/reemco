name: Deploy self-hosted (primary)

# REEA-1054 — PRIMARY production deploy path for the self-hosted box.
#
# Every push to main deploys to the box at /opt/reemco. Since REEA-1076 this is
# the ONLY deploy path: the Vercel rollback plumbing (deploy.yml, pickup.yml,
# vercel.json, VERCEL_TOKEN/VERCEL_TEAM_ID) was removed once the board confirmed
# the box's hostname as production and `reemco.vercel.app` started returning
# 402 DEPLOYMENT_DISABLED.
#
# Artifact decision (REE-1054): the box builds from /opt/reemco/src; GHCR gets
# NO credentials on the box. Rationale and tradeoff are recorded in the
# REEA-1054 report document and README > Deploy. In short: the deploy user has
# no standing registry credential (Least Privilege), the build context is the
# exact pushed tree, and rollback is a local image swap that does not depend on
# a registry being reachable. Blast radius: a build consumes box CPU and the
# npm registry, but it happens BEFORE the running container is touched and a
# failed build leaves the old tag serving.
#
# Rollback: Actions > Deploy self-hosted > Run workflow with `rollback_sha` set
# to the previous known-good commit. If that image is still cached on the box
# it is redeployed without a rebuild (fast, reproducible); if the cache was
# pruned it is rebuilt from that exact commit. Either way it passes the same
# verification gate a deploy runs. On-box rollback.sh is also wired into the
# failure path below.
#
# Required repo secrets (Settings > Secrets > Actions, env injection only):
#   DEPLOY_SSH_KEY      private key for the scoped `deploy` user (no passphrase)
#   DEPLOY_HOST         hostname or IP of the box
#   DEPLOY_USER         deploy user (default deploy; scoped sudo, no root shell)
#   DEPLOY_KNOWN_HOSTS  ssh-keyscan output for the host (pins the host key)
#
# Repo variable PROD_BASE_URL is the single place the public address is set;
# flipping it to the production domain is the DNS-cutover action. The default
# below is the box's current hostname.
#
# The host key is pinned rather than trust-on-first-use: an unpinned key means
# a MITM can receive the deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Commit SHA to redeploy (rollback). Empty = build current head."
        required: false
        default: ""
      site_address:
        description: "Override the public address to verify (defaults to vars.PROD_BASE_URL)."
        required: false
        default: ""

permissions:
  contents: read
  issues: write # failure alert

concurrency:
  group: deploy-selfhosted
  cancel-in-progress: false # never cancel mid-rollout; a half-applied deploy is worse than a queued one

env:
  SITE_ADDRESS: ${{ inputs.site_address || vars.PROD_BASE_URL || 'https://ns539626.ip-144-217-72.net' }}
  IMAGE_REPO: reemco/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_sha || github.sha }}
          fetch-depth: 0

      # REEA-1060 — production dependency audit gate. The committed lockfile is
      # what the box builds from, so a high/critical production advisory must
      # fail the deploy BEFORE the host builds anything. `npm audit` reads
      # package-lock.json directly (no node_modules needed) and its
      # --audit-level=high exit code is the gate; the step is a no-op only for
      # an explicit rollback, which deliberately redeploys a previously verified
      # commit and must not be blocked by an advisory published since.
      - name: Production dependency audit gate (0 high/critical)
        if: github.event_name == 'push' || inputs.rollback_sha == ''
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      # REEA-1067 — BUILD GATE (lint + full test suite) before the artifact is
      # built. The retired Vercel `buildCommand` ran `npm run lint` and the
      # 1004-test suite before `next build`; after the REEA-1054 cutover the
      # box build ran `next build` alone, so a push to main could reach
      # production with no test gate (Blast Radius).
      #
      # This is the push-triggered CI gate, and it runs on the GitHub runner
      # BEFORE any SSH or host build: a red gate never mutates the box, so
      # there is nothing to roll back. The Dockerfile deliberately stays
      # build-only instead of running the suite in-image:
      #  - the box's CPU is production capacity; tests belong on the runner
      #    (Cost-per-Environment), and the box already builds the artifact;
      #  - `.dockerignore` excludes `.github`, but `src/ci-secrets.test.ts`
      #    reads `.github/workflows/deploy-selfhosted.yml`, so an in-image
      #    `npm run test` would need a widened build context to be meaningful.
      #
      # Rollback Path: unchanged (`deploy.sh`/`rollback.sh`, auto-rollback on
      # a failed verify). A `workflow_dispatch` rollback run SKIPS lint/tests:
      # it redeploys a previously verified artifact, and an emergency rollback
      # must not be blocked by a gate that is red on main. The install stays
      # unconditional because the funnel smoke step later needs node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (gate + smoke)
        run: npm ci

      - name: Build gate — lint + full test suite (blocking)
        if: github.event_name == 'push' || inputs.rollback_sha == ''
        run: |
          set -euo pipefail
          npm run lint
          NODE_ENV=test KV_REST_API_URL= KV_REST_API_TOKEN= npm run test

      - name: Resolve the tag to deploy
        id: tag
        run: |
          set -euo pipefail
          SHA="${{ inputs.rollback_sha || github.sha }}"
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::not a commit sha: $SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -n "${{ inputs.rollback_sha }}" ]; then echo "Deploying $SHA as a ROLLBACK"; else echo "Deploying $SHA as a fresh build"; fi

      # REEA-1061 — refuse to ship a stack whose hardening invariants regressed:
      # every service cap_drop ALL / non-root, infra images digest-pinned,
      # proxy and redis on separate networks. Cheap, runs before SSH.
      - name: Assert compose hardening invariants
        run: bash infra/scripts/assert-compose-hardening.sh infra/compose.prod.yml

      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Ship the versioned config and scripts, then deploy. The host never
      # accumulates hand edits: /opt/reemco config+scripts are overwritten from
      # git each run, and /opt/reemco/src is replaced by the exact checkout.
      - name: Sync infra to host
        run: |
          set -euo pipefail
          TARGET="${{ secrets.DEPLOY_USER || 'deploy' }}@${{ secrets.DEPLOY_HOST }}"
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519"
          $SSH "$TARGET" 'sudo mkdir -p /opt/reemco/scripts /opt/reemco/src && sudo chown -R $(id -u):$(id -g) /opt/reemco'
          scp -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 \
            infra/compose.prod.yml infra/Caddyfile "$TARGET:/opt/reemco/"
          scp -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 \
            infra/scripts/deploy.sh infra/scripts/rollback.sh infra/scripts/verify.sh infra/scripts/backup.sh \
            infra/scripts/assert-containers.sh infra/scripts/docker-user-firewall.sh \
            "$TARGET:/opt/reemco/scripts/"
          $SSH "$TARGET" 'chmod +x /opt/reemco/scripts/*.sh'

      # Build the artifact ON THE BOX from the exact pushed tree (no registry
      # credentials there). A rollback whose image is still cached skips the
      # rebuild: rollback = redeploy of the prior artifact, not a new build.
      - name: Build image on host (skip only for a cached rollback artifact)
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.sha }}"
          TARGET="${{ secrets.DEPLOY_USER || 'deploy' }}@${{ secrets.DEPLOY_HOST }}"
          SSH="ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519"
          if [ -n "${{ inputs.rollback_sha }}" ] && $SSH "$TARGET" "docker image inspect $IMAGE_REPO:$TAG >/dev/null 2>&1"; then
            echo "rollback artifact $IMAGE_REPO:$TAG is cached on the host — no rebuild"
            exit 0
          fi
          echo "building $IMAGE_REPO:$TAG from the checked-out tree"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude '.next' --exclude '.events' --exclude '.events-tests' \
            -e "ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_ed25519" \
            ./ "$TARGET:/opt/reemco/src/"
          $SSH "$TARGET" "cd /opt/reemco/src && docker build -f infra/Dockerfile --build-arg REEMCO_COMMIT=$TAG -t $IMAGE_REPO:$TAG . 2>&1 | tail -60"

      - name: Deploy pinned tag
        id: deploy
        run: |
          set -euo pipefail
          TARGET="${{ secrets.DEPLOY_USER || 'deploy' }}@${{ secrets.DEPLOY_HOST }}"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$TARGET" \
            "sudo /opt/reemco/scripts/deploy.sh --tag ${{ steps.tag.outputs.sha }}"

      # Verification from OUTSIDE the box: the gate must prove the public
      # surface, not loopback. Same checks as the retired Vercel pipeline
      # (stamp, four security headers, health) plus the funnel smoke suite.
      - name: Verify public surface (stamp + headers)
        run: |
          set -euo pipefail
          BASE="$SITE_ADDRESS"
          case "$BASE" in http://*|https://*) : ;; *) BASE="https://$BASE" ;; esac
          BASE="${BASE%/}"
          echo "verifying $BASE"
          SERVED=$(curl -fsS -m 20 "$BASE/__commit.txt" | tr -d '[:space:]')
          echo "served stamp: $SERVED"
          [ "$SERVED" = "${{ steps.tag.outputs.sha }}" ] || {
            echo "::error::$BASE serves '$SERVED', expected '${{ steps.tag.outputs.sha }}' — deploy failed. Rollback: rerun with rollback_sha = previous tag."
            exit 1; }
          HEADERS=$(curl -fsSI -m 20 "$BASE/" || true)
          for H in content-security-policy x-content-type-options referrer-policy strict-transport-security; do
            printf '%s\n' "$HEADERS" | grep -iq "^$H:" || { echo "::error::missing header $H on $BASE"; exit 1; }
          done
          # REEA-1084 (F7a) — same assertion the on-box verify.sh makes: the
          # app must not fingerprint its framework. Mirrored here because the
          # external gate is what grades the public surface on a push deploy.
          if printf '%s\n' "$HEADERS" | grep -iq "^x-powered-by:"; then
            echo "::error::X-Powered-By leaked on $BASE"; exit 1
          fi
          echo "stamp + 4/4 security headers verified, X-Powered-By absent"

      # node_modules was installed by the build gate above (unconditionally,
      # so a rollback run that skips lint/tests still has it for the smoke).

      # REEA-1059: the funnel smoke suite is BLOCKING again. It was advisory
      # only while REEA-75's 375px assertion failed deterministically on the
      # healthy `/results` layout (REEA-1054/REEA-1056). Both causes are gone:
      # step 5 now proves reachability inside the deliberately scrollable
      # coverage row (REEA-1056 fix, verified green against the box) and step 7
      # no longer requires the retired PC Kuwait lane (REEA-901). A smoke
      # failure now fails the deploy and takes the same rollback path as a
      # stamp/header mismatch. Advisory is not a resting state: any future
      # exception must carry an open issue + a named flip-back owner, and be
      # recorded in README > Deploy gate.
      - name: Funnel smoke check against the new host (blocking)
        id: smoke
        timeout-minutes: 10
        env:
          SMOKE_BASE_URL: ${{ env.SITE_ADDRESS }}
        run: npm run smoke

      # Rollback path when verification fails: the host's deploy.sh already
      # rolls back automatically on a failed on-box verify; this covers the
      # external checks only the runner can see (stamp/headers, and since
      # REEA-1059 the funnel smoke suite).
      #
      # REEA-1059: only roll back when a deploy actually happened. Before this
      # guard, a CI-only failure (audit gate / compose-hardening assertion,
      # i.e. before SSH) still ran rollback.sh and reverted PRODUCTION to the
      # previous tag for a failure that never touched the box.
      - name: Roll back on external verification failure
        if: failure() && steps.deploy.outcome == 'success'
        run: |
          set -uo pipefail
          TARGET="${{ secrets.DEPLOY_USER || 'deploy' }}@${{ secrets.DEPLOY_HOST }}"
          echo "external verification failed — invoking on-host rollback"
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "$TARGET" \
            'sudo /opt/reemco/scripts/rollback.sh' || echo "::warning::rollback did not complete — page the on-call"

      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deploy-alert --color D93F0B --description "Deploy/verification failure" --force || true
          BODY="Self-hosted deploy failed at $(date -u +%FT%TZ).
          Commit: ${{ steps.tag.outputs.sha }}. Target: ${SITE_ADDRESS}.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Rollback: rerun this workflow with rollback_sha = the previous known-good commit."
          if gh issue list --label deploy-alert --state open --json url -q '.[0].url' | grep -q .; then
            gh issue comment "$(gh issue list --label deploy-alert --state open --json number -q '.[0].number')" --body "$BODY"
          else
            gh issue create --title "DEPLOY ALERT: self-hosted deploy failed" --label deploy-alert --body "$BODY"
          fi
