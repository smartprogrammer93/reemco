name: Pickup production stamp

# REEA-555: origin/main merges reach the served stamp without a manual flip.
# Every push to main runs this slim job, so the stamp catches up on its own —
# REEA-496/507/517/520/528-style "pickup trigger" commits and the follow-up
# dashboard/dispatch hop are no longer needed.
#
# Mechanism (settings/hooks only, no product-code changes): push event -> this
# job -> `vercel deploy --prod` (same verified deploy.yml path, secrets
# VERCEL_TOKEN / VERCEL_TEAM_ID via env injection only) -> poll-verify
# https://reemco.vercel.app/__commit.txt against the pushed SHA. The lint +
# test + `next build` gate stays where it already is: vercel.json buildCommand
# on Vercel compute, so this job only submits the deploy and watches. Existing
# checks keep working: /__commit.txt is stamped with the pushed SHA before
# upload, /api/health `build` field comes from the artifact.
#
# Timeout sizing (measured 2026-09-10): morning path pushed 18:45:37Z -> Ready
# ~18:52Z (~6-7 min). Evening queue (REEA-578: pushes 21:12Z and 21:42Z) showed
# the alias still serving the previous artifact ~12 min after submit, so both
# pickup runs died at the old ceilings before the stamp could flip. Ceilings
# raised: CLI stream ceiling 14m, job ceiling 18m, poll window up to ~6 min via
# the health fallback. The CLI `timeout` stays a stream ceiling, NOT the success
# bar: hitting it does not cancel the remote build, and the stamp poll below is
# the authoritative verify. A stuck queue is drained with Actions > Run
# workflow on this file (workflow_dispatch) instead of a filler push.
#
# Concurrency: bursts (coder harness pushes several commits quickly) collapse —
# cancel-in-progress keeps only the newest run, whose deploy carries the full
# tree of the latest head, so the final alias lands on the head commit.
#
# Blast radius: production alias re-alias only. If the remote build fails, the
# previous artifact keeps serving and this job goes red with the builder log.
# Rollback: rerun Actions > Deploy site with rollback_sha = last known-good
# commit (verified heavy path), or revert on main — the next push is picked up
# by this workflow. Equivalently Vercel dashboard > Promote Previous Deployment.

on:
  push:
    branches: [main]
  workflow_dispatch: # REEA-578 drain: rerun the pickup for the current head without needing a filler push

permissions:
  contents: read

concurrency:
  group: pickup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pickup:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Deploy pushed head to the production alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -u -o pipefail
          export VERCEL_TELEMETRY_DISABLED=1
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::Repo secret VERCEL_TOKEN is not set - cannot pick up the push. Unblock owner: repo admin (CEO)."
            exit 1
          fi
          # Same stamp convention as deploy.yml / vercel.json buildCommand so
          # /__commit.txt and the health `build` field keep their meaning.
          echo "${GITHUB_SHA}" > public/__commit.txt
          SCOPE_ARGS=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then SCOPE_ARGS="--scope $VERCEL_TEAM_ID"; fi
          # Pinned CLI + stream ceiling (REEA-75 hardening). The ceiling is not
          # decisive: when it trips, the remote build still finishes and the
          # next step verifies the alias by polling. `|| true` keeps the
          # ceiling from redding a run whose stamp actually landed.
          timeout --signal=INT 14m npx -y vercel@59.11.7 deploy --prod --yes \
            --cwd "$GITHUB_WORKSPACE" $SCOPE_ARGS 2>&1 | tee /tmp/vercel-pickup.log \
            || echo "CLI stream ended early - stamp poll decides."

      - name: Verify served stamp matches the pushed head (authoritative)
        run: |
          set -u
          WANT="${GITHUB_SHA}"
          WANT12="${WANT:0:12}"
          OK=0
          for i in $(seq 1 36); do
            S=$(curl -fsS -m 10 https://reemco.vercel.app/__commit.txt 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$S" = "$WANT" ] || [ "$S" = "$WANT12" ]; then OK=1; echo "stamp parity after poll $i (~$((i*10))s): $S"; break; fi
            # REEA-578: edge nodes intermittently answer the stamp route with
            # the Vercel Security Checkpoint interstitial instead of the
            # artifact stamp; /api/health is not challenged and its build
            # field is stamped from the same source commit, so treat a health
            # build-prefix match as the same authority and keep polling.
            H=$(curl -fsS -m 10 https://reemco.vercel.app/api/health 2>/dev/null || true)
            case "$H" in *"$WANT12"*) OK=1; echo "stamp parity via health build after poll $i (~$((i*10))s): $H"; break;; esac
            sleep 10
          done
          if [ "$OK" != 1 ]; then
            echo "::error::reemco.vercel.app still serves ${S:-nothing} after ~6 min, want $WANT. Rollback: rerun Deploy site with rollback_sha = last known-good commit."
            exit 1
          fi
          H=$(curl -fsS -m 10 https://reemco.vercel.app/api/health || true)
          echo "health: $H"
          echo "$H" | grep -q "${WANT:0:12}" || echo "::warning::health build field does not carry the new sha yet: $H"
          echo "PICKUP OK: alias serves $WANT; __commit.txt verified, health build checked." | tee -a "$GITHUB_STEP_SUMMARY"
