name: Pickup production stamp

# REEA-555: origin/main merges reach the served stamp without a manual flip.
# Every push to main runs this slim job, so the stamp catches up on its own —
# REEA-496/507/517/520/528-style "pickup trigger" commits and the follow-up
# dashboard/dispatch hop are no longer needed.
#
# Mechanism (settings/hooks only, no product-code changes): push event -> this
# job -> `vercel deploy --prod` (the same verified deploy.yml path, same repo
# secrets VERCEL_TOKEN / VERCEL_TEAM_ID via env injection only) -> poll-verify
# https://reemco.vercel.app/__commit.txt against the pushed SHA. The lint +
# test + `next build` gate stays where it already is: vercel.json buildCommand
# on Vercel compute, so this job adds ~1 hosted minute per push burst and zero
# npm work. Existing checks keep working: /__commit.txt is stamped with the
# pushed SHA before upload, /api/health `build` field comes from the artifact.
#
# Concurrency: bursts (coder harness pushes several commits quickly) collapse —
# cancel-in-progress keeps only the newest run, whose deploy carries the full
# tree of the latest head, so the final alias lands on the head commit.
#
# Blast radius: production alias re-alias only. If the remote build fails, the
# previous artifact keeps serving and this job goes red with the builder log.
# Rollback: rerun Actions > Deploy site with rollback_sha = last known-good
# commit (verified heavy path), or revert on main — the next push is picked up
# by this workflow. Equivalently Vercel dashboard > Promote Previous Deployment.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pickup-${{ github.ref }}
  cancel-in-progress: true


