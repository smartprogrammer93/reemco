name: CI

# REEA-314 minute-budget notes:
# - `push: branches:[main]` trigger removed on purpose: main pushes are gated
#   by Vercel's own project build (deploy-time check lives there) plus the
#   hourly live-site smoke check; PRs are validated here. Docs-only changes
#   skip CI via paths-ignore. This removes the old CI+deploy double-billing of
#   every merge (~12.6 min each in measured history).
# - GitHub-hosted runners: monitoring + PR CI footprint ≈ 600 min/month, well
#   inside the ~2,000 min/month free allowance — no paid add-on, no extra
#   runner infra required. If cadence grows later, move this job to a
#   self-hosted runner (one-line change here).
on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
