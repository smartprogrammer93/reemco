name: Keep production alias warm

# REEA-371: first request after idle must answer HTTP 200 JSON from /api/health
# within 5s. The Hobby-plan alias scales its function down between traffic, so
# the first shopper of a quiet window paid a ~30s cold boot (CEO ground-truth
# check 2026-09-09 ~03:04Z: HTTP 503 after ~29.5s on first hit, instant 200 on
# retry). This workflow pre-warms the alias on a schedule by GETting the cheap
# /api/health endpoint — same route the Vercel cron already uses, so the ping
# also keeps functioning as the funnel liveness check (Observability-before-Launch).
#
# Mechanism split (issue decision rule: "minimum instances if the plan
# supports it, otherwise scheduled pre-warm"): the minInstances floor was
# tried first (vercel.json functions block). It REGRESSED the deploy path on
# this host - deploys with the key failed the platform validator (@06:11Z and
# @06:18Z runs, red at the Deploy step) while the identical app code without
# the key was green (@05:35Z), matching the REEA-322 precedent that Vercel
# validates this file strictly (additionalProperties:false). The plan-supported
# branch is unavailable here, so the scheduled/push pre-warm below is the
# operative mechanism. Blast radius: one GET on a read-only route; worst
# failure mode is a cold first hit, exactly the pre-existing status quo.
#
# Cadence (re-measured 2026-09-11, REEA-611 idle ladder at ~04:47-04:55Z): the
# fast-answer window after a hit is shorter than the old note claimed — a probe
# 65s after a warm hit answered fast (health ~1.4s, results ~4.9s) while one
# 120s after answered cold (~17.6s boot on health). So the durable guarantee is
# "arrival within ~60-90s of the last ping", not "~5 min"; the tick lane cannot
# cover every minute on the Hobby Actions budget, so it is treated as the dense
# daytime coverage layer (push clusters + drained cron queue) with the Vercel
# daily anchors (vercel.json crons) as the deterministic floor. Step cron
# "2-59/5 * * * *" stays every 5 min, off the :00 spike (REAAs 71/337 anchor
# hygiene). Scheduled ticks skip occasionally in this environment (REEA-71);
# with cancel-in-progress:false the queued ticks run when the queue drains, so
# a skipped tick now self-heals in bursts rather than being cancelled away;
# `push` triggers the same ping because push runs proved the reliable trigger
# here (uptime.yml pairs), and deploy pushes land right when a fresh artifact
# most wants warming. Each tick is curl-only (no checkout, no node install):
# ~8s typical runner time.
# Cost math (REEA-314 budget): 288 ticks/day x ~8s = ~38 min/day ~= 1,150
# min/month typical worst-case ceiling; with smoke-scheduled (~600) and the
# push-triggered uptime/CI pairs this stays inside the ~2,000 min/month Hobby
# Actions allowance. Queued overlaps wait their turn and run back-to-back when
# the queue drains (~8s each); nothing is cancelled, and the billable total
# stays at the tick-count ceiling above. Rollback: delete the `schedule:` cron
# line (or the whole file) and push — the alias keeps serving from smoke-check
# + push anchors, no other behavior depends on this file.

on:
  schedule:
    - cron: "2-59/5 * * * *" # every 5min off-peak; densest cadence the Actions budget allows, queued ticks now self-heal in drain bursts (REEA-611)
  push:
    branches: [main] # deploy pushes warm the fresh artifact immediately; reliable trigger in this environment
  workflow_dispatch:

permissions:
  issues: write # deduped uptime-alert on sustained ping failure

concurrency:
  group: keep-warm
  # REEA-611: let queued ticks queue instead of cancelling each other. With the
  # evening queue lag measured in REEA-578 (>=12 min), cancel-in-progress:true
  # made every newly queued tick cancel its still-queued predecessor, so behind
  # a lagging queue almost nothing started and the effective cadence collapsed
  # to roughly hourly (solo scheduled runs observed ~hourly on 2026-09-10/11).
  # Queued-but-not-started runs bill nothing, so the tick COUNT billed per month
  # is unchanged when the queue drains; what changes is that queued ticks
  # actually run in back-to-back bursts instead of being cancelled away.
  cancel-in-progress: false

jobs:
  warm:
    # Same GitHub-hosted rationale as uptime.yml (REEA-314): curl-only job,
    # must keep working when the self-hosted runner is offline. Timeout bounds
    # a stuck run; two attempts fit comfortably in 4 min.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      # Attempt 1 absorbs the cold boot (measured ~30s, sometimes a 503 while
      # the function is still starting); attempt 2 lands on the warm path and
      # proves the envelope a shopper sees. Only a still-unhealthy alias after
      # both attempts counts as a failure signal. Timing is logged every tick
      # so the Actions history is the cold/hot trend line.
      - name: Pre-warm production alias via /api/health
        id: warm
        run: |
          set -u
          BASE="https://reemco.vercel.app"
          OK=""
          for attempt in 1 2; do
            METRICS=$(curl -s -o /tmp/health.json -w '%{http_code} %{time_total}' --max-time 60 "$BASE/api/health" || echo "000 0")
            CODE="${METRICS%% *}"; SECS="${METRICS##* }"
            echo "attempt $attempt -> HTTP $CODE in ${SECS}s"
            if [ "$CODE" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
              OK=yes
              echo "warmed attempt=$attempt code=$CODE secs=$SECS" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 5
          done
          if [ -z "$OK" ]; then
            echo "::warning::keep-warm ping did not reach healthy 200 JSON after two attempts"
            exit 1
          fi

      # Alerting reuses the deduped uptime-alert lane from uptime.yml so a
      # failing alias produces one issue, not one per tick (MTTR: single noisy
      # signal; Idempotency: same comment-or-create flow as the uptime probe).
      - name: Alert on failure (deduped uptime-alert)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Keep-warm ping failed at $(date -u +%FT%TZ): /api/health did not reach healthy 200 JSON on two attempts - production alias may be cold or unhealthy. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh issue list --label uptime-alert --state open --json number -q '.[0].number' | grep -q .; then
            gh issue comment "$(gh issue list --label uptime-alert --state open --json number -q '.[0].number')" --body "$BODY"
          else
            gh issue create --title "UP ALERT: keep-warm ping failing on production alias" --label uptime-alert --body "$BODY"
          fi
