name: Timing probe (REEA-81)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Measure results-page load+render timing (smoke step-4 semantics, no badge assertion)
        env:
          SMOKE_BASE_URL: ${{ vars.PROD_BASE_URL || 'https://ns539626.ip-144-217-72.net' }}
        run: |
          node scripts/reea81-probe.mjs
          curl -s "$SMOKE_BASE_URL/__commit.txt" | sed 's/^/PROBED artifact: /'
