name: Timing probe (REEA-81)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timing-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Measure results-page load+render timing (smoke step-4 semantics, no badge assertion)
        env:
          SMOKE_BASE_URL: https://reemco-price-compare-preview.surge.sh
        run: node scripts/reea81-probe.mjs
          curl -s "$SMOKE_BASE_URL/__commit.txt" | sed 's/^/PROBED artifact: /'
