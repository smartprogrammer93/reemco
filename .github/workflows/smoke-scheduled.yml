name: Scheduled live-site smoke check

# REEA-58: functional smoke check of the LIVE site on a schedule, so regressions
# are caught between deploys (the post-deploy smoke in deploy.yml only runs when
# something is deployed).
#
# Reuses scripts/smoke-check.mjs from REEA-44 (home → search results → click-out),
# which is deterministic: the fixture query hits the seeded catalog shipped in the
# bundle, never fresh scraping data.
#
# Resilience: one in-run retry before failing (transient network blips should not
# page anyone). A real failure opens a deduped `smoke-alert` GitHub issue naming
# the failed step + run URL — surfaces via repo notifications/email.
#
# Alerting path: GitHub issue labeled `smoke-alert` (deduped) + failed run in
# Actions. Ops lenses: Observability-before-Launch, MTTR (deduped issue = one
# signal, not one per cron tick), Idempotency (same script as post-deploy check),
# Cost-per-Environment (single job, ~2 min runner, hourly).
#
# REEA-71: GitHub-hosted cron was observed silently skipping ticks in this repo
# (uptime.yml on a */5 cron had multi-hour gaps; the smoke check's 13:17Z and
# 14:17Z ticks produced no run). Mitigation: fire on several cron lines per hour
# and dedupe with a guard step that no-ops unless the last completed run is
# older than 75 minutes. Missed ticks self-heal on the next one (Idempotency);
# runner cost stays ~hourly because of the guard.
on:
  schedule:
    - cron: "17 * * * *" # hourly anchor, off the :00 spike
    - cron: "47 * * * *" # second chance each hour when a tick is skipped
  workflow_dispatch:



concurrency:
  group: smoke-scheduled
  cancel-in-progress: true

jobs:
  smoke:
    # REEA-314: intentionally kept on GitHub-hosted runners — cheap (guard-only
    # ticks cost seconds) and monitoring must keep working even when the
    # self-hosted runner that hosts deploy.yml/ci.yml is offline. Guard runs as
    # the FIRST step (before checkout) so skipped ticks bill only the API call
    # instead of a full checkout + node setup. Timeout bounds a stuck run.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # REEA-71 dedupe guard: with multiple cron lines, most ticks are redundant.
      # Only run the smoke check if the last completed run is >= 75 min old
      # ( hourly cadence + slack for cron delay). Manual dispatches always run.
      - name: Guard — skip if last completed run is under 75 min old
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/smoke-scheduled.yml/runs?status=completed&per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$LAST" ]; then
            echo "No previous completed run — due."
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [ $(( $(date -u +%s) - $(date -u -d "$LAST" +%s) )) -lt 4500 ]; then
            echo "Last completed run $LAST is <75min old — not due; skipping tick."
            echo "due=false" >> "$GITHUB_OUTPUT"
          else
            echo "Last completed run $LAST is stale — due (missed-tick self-heal)."
            echo "due=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.due != 'false'

      # REEA-337 deploy parity self-heal: compare the served artifact stamp with
      # this run's main HEAD. On mismatch, dispatch the Deploy site workflow
      # (its own concurrency + post-deploy stamp check make repeated dispatches
      # safe/idempotent), then poll the stamp briefly and report before/after.
      # Runs inside the existing hourly tick — zero extra scheduled jobs, so the
      # ~2,000 min/month REEA-314 budget is unaffected. curl+gh only: no node.
      - name: Deploy parity self-heal (REEA-337)
        if: steps.guard.outputs.due != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          SERVED=$(curl -fsS --max-time 15 "https://reemco.vercel.app/__commit.txt?parity=$RANDOM$RANDOM" | tr -d '[:space:]' || echo empty)
          HEAD="${{ github.sha }}"
          echo "parity before: served=$SERVED intended=$HEAD"
          if [ "$SERVED" = "$HEAD" ]; then
            echo "parity green - no dispatch needed"
            exit 0
          fi
          echo "parity lag detected - dispatching Deploy site for $HEAD"
          echo '{"ref":"${{ github.ref_name }}"}' > /tmp/dispatch.json
          gh api --method POST \
            "repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            --input /tmp/dispatch.json && echo "dispatch accepted" || echo "dispatch call failed"
          AFTER=""
          for i in $(seq 1 12); do
            sleep 15
            AFTER=$(curl -fsS --max-time 15 "https://reemco.vercel.app/__commit.txt?after=$i$RANDOM" | tr -d '[:space:]' || echo empty)
            echo "poll $i: served=$AFTER"
            [ "$AFTER" = "$HEAD" ] && break
          done
          echo "parity after: served=$AFTER intended=$HEAD $([ "$AFTER" = "$HEAD" ] && echo MATCH || echo MISMATCH)"
          [ "$AFTER" = "$HEAD" ] || echo "::warning::parity still lagging after self-heal dispatch - check the Deploy site run"

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.due != 'false'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.guard.outputs.due != 'false'

      - name: Smoke check live site (home → search → click-out)
        id: smoke
        if: steps.guard.outputs.due != 'false'
        env:
          SMOKE_BASE_URL: https://reemco.vercel.app
        run: npm run smoke

      # One retry to absorb transient network blips (false-positive alerting
      # burns error budget on noise). A second failure is a real regression.
      - name: Retry once on failure
        id: retry
        if: failure()
        env:
          SMOKE_BASE_URL: https://reemco.vercel.app
        run: |
          echo "first attempt failed - retrying once to rule out a transient blip"
          sleep 30
          npm run smoke

      - name: Open deduped smoke-alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create smoke-alert --color D93F0B --description "Scheduled live-site smoke check failure" --force || true
          FAILED_STEPS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join("; ")')
          BODY="Scheduled smoke check of the live site failed at $(date -u +%FT%TZ) (failed twice, not a transient blip).
          Failed step(s): ${FAILED_STEPS:-unknown}.
          Site: https://reemco.vercel.app
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          A regression is live that no deploy introduced (site serves artifact $(curl -fsS https://reemco.vercel.app/__commit.txt || echo unknown)). Investigate recent deploys first (rollback: Actions > Deploy site > Run workflow with rollback_sha = last green commit), then the live host itself."
          if gh issue list --label smoke-alert --state open --json url -q '.[0].url' | grep -q .; then
            gh issue comment "$(gh issue list --label smoke-alert --state open --json number -q '.[0].number')" \
              --body "$BODY"
          else
            gh issue create --title "SMOKE ALERT: live-site scheduled smoke check failed — $FAILED_STEPS" \
              --label smoke-alert --body "$BODY"
          fi
