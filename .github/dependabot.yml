# REEA-1135 (F7) — Dependabot keeps the commit-SHA pins in
# .github/workflows/*.yml current. Workflows pin actions/checkout and
# actions/setup-node by full commit SHA (a mutable major tag can be moved by
# the action's owner); Dependabot rewrites the SHA and the `# vX.Y.Z` comment
# in a reviewed PR instead of us bumping them by hand.
#
# The deploy job holds DEPLOY_SSH_KEY, so an action bump is a production-path
# change: the PR still has to pass the build gate (lint + full suite) before
# merge, and the deploy workflow verifies the stamp afterwards.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
