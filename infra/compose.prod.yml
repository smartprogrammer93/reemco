# infra/compose.prod.yml — REEA-1044 single-server production stack.
#
# Deployed by infra/scripts/deploy.sh (which is driven by
# .github/workflows/deploy-selfhosted.yml). The image tag is the only thing
# that changes between deploys; it is read from /etc/reemco/image-tag.env.
#
#   docker compose -f /opt/reemco/compose.prod.yml \
#     --env-file /etc/reemco/release.env --env-file /etc/reemco/image-tag.env up -d
#
# Secrets live in /etc/reemco/app.env (0600, deploy-owned, env injection only)
# and are never baked into the image. Non-secret site config lives in
# /etc/reemco/release.env (0640). Both are provisioned by infra/ansible.
#
# REEA-1061 — container hardening. Every service is capability-minimal, and the
# two infrastructure images are digest-pinned so a moved tag cannot silently
# change what runs on the next `up -d`:
#   * app:    uid 1001 from infra/Dockerfile, cap_drop ALL, no-new-privileges.
#   * redis:  runs as the image's unprivileged `valkey` user, cap_drop ALL,
#             read-only rootfs, /data volume is the only writable path.
#   * proxy:  runs as uid 1000 (the official caddy:2-alpine image ships no
#             non-root user; /usr/bin/caddy carries cap_net_bind_service, so a
#             plain numeric uid plus cap_add NET_BIND_SERVICE can bind 80/443).
#             cap_drop ALL, read-only rootfs, /data and /config volumes are the
#             only writable paths (chowned by deploy.sh before `up`).
# Networks are segmented: proxy <-> app on `edge`, app <-> redis on `data`.
# Proxy cannot reach Valkey; Valkey cannot reach anything outside `data`.
#
# The invariants above are asserted by infra/scripts/assert-compose-hardening.sh
# in CI and by infra/scripts/assert-containers.sh after every deploy/rollback.
name: reemco

services:
  app:
    image: ${REEMCO_IMAGE_REPO:-ghcr.io/smartprogrammer93/reemco}:${REEMCO_IMAGE_TAG:?set REEMCO_IMAGE_TAG to a pinned 40-char commit sha}
    env_file:
      - /etc/reemco/app.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Durable in-container paths. VERCEL/AWS_LAMBDA must stay unset so
      # event-store/metrics/collect-store do not fall back to /tmp.
      EVENTS_DIR: /data/events
      METRICS_DIR: /data/metrics
      COLLECT_CACHE_DIR: /data/collect
      # /api/health walks the funnel against its own origin. Pin it to loopback
      # so the probe does not depend on public DNS, TLS or NAT hairpin: those
      # hops are asserted by verify.sh and the external smoke suite instead.
      REEMCO_HEALTH_ORIGIN: http://127.0.0.1:3000
      # REEA-1051 — crawler-facing canonical origin (/sitemap.xml,
      # /robots.txt). Derived from the one address line in release.env so the
      # live box advertises itself; changing REEMCO_SITE_ADDRESS changes this
      # with it (the retired Vercel alias is no longer a fallback — REEA-1076).
      REEMCO_SITE_ORIGIN: https://${REEMCO_SITE_ADDRESS:-ns539626.ip-144-217-72.net}
      # REEA-1044 — shared store for collect jobs, metrics and rate limits.
      # The app speaks RESP directly to the local Valkey container (kv-redis.ts);
      # there is no Upstash, no REST gateway and no hosted service in the path.
      # Non-secret, so it lives here rather than in app.env.
      # REEA-1061: resolves on the `data` network only; the proxy is not on it.
      REDIS_URL: redis://redis:6379/0
    volumes:
      - events:/data/events
      - metrics:/data/metrics
      - collect:/data/collect
    depends_on:
      redis:
        condition: service_healthy
    # Loopback only, never public: the scheduled health probe
    # (reemco-health.timer) runs as a host unit against 127.0.0.1:3000, and
    # MTTR diagnostics can curl the app directly without going through Caddy.
    ports:
      - "127.0.0.1:3000:3000"
    # 32 GB box: leave ~4 GB headroom for page cache, Caddy, Valkey and the
    # OS.
    # REEA-1226 — headless Chromium DOES run in this container now: the
    # REEA-1221 browser-clearance tier launches it for the Next Store lane (the
    # old "CI-only smoke dependency" comment was stale). One Chromium is ~59
    # threads (browser + 2 zygotes + GPU + network utility) and the render
    # admission cap allows several at once, so the old 512 ceiling was reached:
    # measured on the served head 2026-11-26, pids.current 510 / pids.max 512
    # with 7 live Chromium instances holding 411 threads, and the next
    # `clone()` failed with `pthread_create: Resource temporarily unavailable`
    # (EAGAIN). 2048 is ~3x the observed peak, covers the full admission cap
    # plus a launch overlap, and stays a bounded fork-bomb guard. Chromium
    # needs ~40-60 threads; do not drop this below 1024.
    mem_limit: 6g
    cpus: 6.0
    pids_limit: 2048
    # REEA-1061 — the app binds 3000 (>1024) and is already uid 1001 from the
    # image; it needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    restart: unless-stopped
    healthcheck:
      # Cheap liveness probe: the commit stamp is a static file, so this does
      # not re-run the /api/health funnel walk every 30 s.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/__commit.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge
      - data

  redis:
    # Local Valkey is the app's shared KV store (REDIS_URL above). It is on the
    # private `data` compose network only — never published to the host, never
    # exposed by Caddy, and the proxy cannot reach it.
    # REEA-1061: digest-pinned. Current digest at the time of the change:
    # valkey/valkey@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    # (valkey 8-alpine). Bump deliberately, record the new digest in the deploy
    # comment, and re-run the hardening assertions.
    image: valkey/valkey@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
    command:
      [
        "valkey-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "384mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    # Run as the image's unprivileged user instead of PID 1 as root. The
    # entrypoint's root-only `chown /data` + `setpriv` path is skipped when
    # uid != 0, so deploy.sh chowns the named volume before `up` (idempotent,
    # uses the same pinned image; see ensure_volume_ownership there).
    user: valkey
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    # Valkey writes AOF/RDB to /data only; /tmp is a scratch tmpfs in case a
    # future config needs it.
    tmpfs:
      - /tmp
    pids_limit: 256
    volumes:
      - redis:/data
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - data

  proxy:
    # REEA-1061: digest-pinned. Current digest at the time of the change:
    # caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    # (caddy 2-alpine). Bump deliberately and record the new digest.
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    environment:
      # Set in /etc/reemco/release.env. During standup use the box's public IP
      # (plain HTTP); at cutover switch to the real hostname (automatic TLS).
      REEMCO_SITE_ADDRESS: ${REEMCO_SITE_ADDRESS:?set REEMCO_SITE_ADDRESS in /etc/reemco/release.env}
    # The official caddy:2-alpine image has no non-root user, but /usr/bin/caddy
    # carries cap_net_bind_service and a plain numeric uid works with
    # cap_add NET_BIND_SERVICE (verified on the host, REEA-1061). deploy.sh
    # chowns caddy-data/caddy-config to 1000:1000 before `up`.
    user: "1000:1000"
    cap_drop:
      - ALL
    cap_add:
      # The only capability any service is allowed to add: binding 80/443 and
      # 443/udp below the privileged-port boundary as a non-root user.
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    # /tmp is the only path Caddy needs outside its data/config volumes.
    tmpfs:
      - /tmp
    pids_limit: 128
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/reemco/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - edge

volumes:
  events:
  metrics:
  collect:
  redis:
  caddy-data:
  caddy-config:

networks:
  # Public edge: proxy -> app only. Caddy needs egress here for ACME/OCSP.
  edge:
  # Private data plane: app <-> redis only, no gateway to the outside world.
  data:
    internal: true
