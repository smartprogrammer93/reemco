# REEA-1044 — example inventory. Copy to inventory.yml (gitignored) and point
# ansible-playbook at it. For a run *on* the box itself use:
#   ansible-playbook -i localhost, -c local infra/ansible/playbook.yml
#
# Least privilege: ansible connects as the non-root admin user with a key;
# privilege escalation is scoped to the playbook tasks that need root. Docker
# Engine and Compose pins live in the playbook vars, so a rebuild converges to
# the same versions even with a minimal inventory.
all:
  hosts:
    reemco-prod:
      ansible_host: 144.217.72.236 # ns539626.ip-144-217-72.net
      ansible_user: ubuntu
      ansible_ssh_private_key_file: ~/.ssh/reemco_admin_ed25519
      ansible_python_interpreter: /usr/bin/python3
