---
# REEA-1044 — host provisioning for the single-server Reemco deployment.
#
# Idempotent: re-running this on a provisioned host converges it back to git,
# which is the whole point (no snowflake server). It does NOT touch the app
# image tag — deploys go through infra/scripts/deploy.sh / the workflow, so a
# playbook run can never silently roll the app forward or back.
#
# Usage:
#   ansible-playbook -i infra/ansible/inventory.yml infra/ansible/playbook.yml \
#     --check   # dry run first, per §3a delta #2
#
# Blast radius: package set, docker daemon config, UFW, /opt/reemco config,
# systemd timers. It does not stop the app; `docker compose up -d` is only run
# when a compose/Caddy file actually changed (handler).
- name: Provision Reemco production host
  hosts: all
  become: true
  gather_facts: true
  vars:
    reemco_root: /opt/reemco
    reemco_etc: /etc/reemco
    reemco_user: deploy
    # Pinned Docker Engine + Compose plugin (26.04 delta #5: Docker's apt repo,
    # not Ubuntu's docker.io). Bump deliberately, record the new version in the
    # deploy note, and keep the pins here — not only in a per-host inventory —
    # so a rebuild of the box converges to the same versions.
    docker_version: "5:29.10.0-1~ubuntu.26.04~resolute"
    compose_version: "5.8.0-1~ubuntu.26.04~resolute"
    # REEA-1087 (F9) — SSH source allowlist. Empty = keep 22/tcp open to Anywhere,
    # which is the recorded, explicit decision (key-only SSH + fail2ban maxretry 4
    # is the compensating control) until the board supplies the admin/office/VPN
    # CIDR. Set it here (single knob, versioned) and a playbook run applies
    # `allow from <CIDR> to any port 22` and deletes the world-open rule; keep the
    # current session open and prove a NEW connection before you finish.
    reemco_ssh_allow_from: ""

  tasks:
    - name: Refuse to provision on the wrong OS
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version is version("24.04", ">=")
        fail_msg: >-
          Expected Ubuntu 24.04 or newer (target: 26.04 LTS). Got
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
        quiet: true

    # §3a delta #2 — the deploy/backup scripts use cp/mv/find/stat/du. If the
    # Rust coreutils replacement misbehaves, install the classic package.
    - name: Install classic GNU coreutils (26.04 delta #2 fallback)
      ansible.builtin.apt:
        name: coreutils
        state: present

    - name: Base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - jq
          - ufw
          - fail2ban
          - unattended-upgrades
          - chrony
          - restic
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker apt key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Docker apt repository (26.04 delta #5 — Docker's repo, pinned)
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        mode: "0644"
        content: |
          deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

    - name: Install pinned Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - "docker-ce={{ docker_version }}"
          - "docker-ce-cli={{ docker_version }}"
          - containerd.io
          - docker-buildx-plugin
          - "docker-compose-plugin={{ compose_version }}"
        state: present
        update_cache: true
        allow_downgrade: true

    - name: Docker daemon config (log rotation, live-restore, no-new-privileges)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "data-root": "/var/lib/docker",
            "log-driver": "json-file",
            "log-opts": { "max-size": "20m", "max-file": "5" },
            "live-restore": true,
            "no-new-privileges": true
          }
      notify: restart docker

    - name: Ensure docker is running
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    # Least privilege: the deploy user can drive docker, not the whole host.
    - name: Deploy user in docker group
      ansible.builtin.user:
        name: "{{ reemco_user }}"
        groups: docker
        append: true

    # REEA-1054 — the CI deploy path SSHes as `deploy` (repo secret
    # DEPLOY_SSH_KEY) and needs exactly the scripts below, never a root shell.
    # The key itself is injected out-of-band; the playbook guarantees the
    # directory and the sudo allow-list, so a rebuilt box converges.
    - name: Deploy user ssh directory
      ansible.builtin.file:
        path: "/home/{{ reemco_user }}/.ssh"
        state: directory
        owner: "{{ reemco_user }}"
        group: "{{ reemco_user }}"
        mode: "0700"

    - name: Scoped sudo for the deploy scripts (no root shell)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/reemco-deploy
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          # REEA-1054 — scoped sudo for the CI deploy path. deploy has no root
          # shell; only these binaries run as root. Everything else is
          # docker-group only.
          Cmnd_Alias REEMCO_OPS = /usr/bin/mkdir, /usr/bin/chown, /usr/bin/chmod, /usr/bin/install, /opt/reemco/scripts/deploy.sh, /opt/reemco/scripts/rollback.sh, /opt/reemco/scripts/verify.sh, /opt/reemco/scripts/backup.sh, /opt/reemco/scripts/restore-drill.sh, /opt/reemco/scripts/assert-containers.sh
          deploy ALL=(root) NOPASSWD: REEMCO_OPS

    # REEA-1062 — SSH/fail2ban hardening was declared ONLY in cloud-init.yaml,
    # which runs once at first boot. Nothing re-applied it on an already-built
    # box, so the effective config silently fell back to the cloud image
    # defaults (root login prohibit-password, X11 on, maxauthtries 6,
    # fail2ban 5/600/600). Keep the same content here so a rebuild converges and
    # drift is corrected on the next playbook run. Content is byte-for-byte the
    # cloud-init declaration; change both together.
    #
    # Safety: the handler runs `sshd -t` BEFORE reloading, so a bad drop-in
    # fails the play and leaves the running sshd untouched — never lock out.
    - name: SSH hardening drop-in (mirrors infra/cloud-init.yaml)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-reea1044.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # 26.04 delta #4: OpenSSH 10.2 defaults — re-verify `sshd -t` and that
          # key-only auth works before closing the provider console.
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          X11Forwarding no
          MaxAuthTries 4
          ClientAliveInterval 300
          ClientAliveCountMax 2
      notify: validate and reload sshd

    - name: fail2ban sshd jail (mirrors infra/cloud-init.yaml)
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          maxretry = 4
          bantime = 1h
          findtime = 10m
      notify: validate and reload fail2ban

    - name: Config directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ reemco_root }}", mode: "0755" }
        # REEA-1062 — 0750 made /etc/reemco/NOTES.md unreadable to the `ubuntu`
        # automation user (the server-ssh skill's `cat` failed). 0755 exposes
        # filenames only: app.env stays 0640 root:deploy, restic.pass 0600.
        - { path: "{{ reemco_etc }}", mode: "0755" }
        - { path: "/opt/reemco/scripts", mode: "0755" }
        - { path: "/var/log/reemco", mode: "0755" }

    - name: Install compose stack, proxy config and scripts from the repo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - { src: "compose.prod.yml", dest: "/opt/reemco/compose.prod.yml", mode: "0644" }
        - { src: "Caddyfile", dest: "/opt/reemco/Caddyfile", mode: "0644" }
        - { src: "scripts/deploy.sh", dest: "/opt/reemco/scripts/deploy.sh", mode: "0755" }
        - { src: "scripts/rollback.sh", dest: "/opt/reemco/scripts/rollback.sh", mode: "0755" }
        - { src: "scripts/verify.sh", dest: "/opt/reemco/scripts/verify.sh", mode: "0755" }
        - { src: "scripts/backup.sh", dest: "/opt/reemco/scripts/backup.sh", mode: "0755" }
        - { src: "scripts/restore-drill.sh", dest: "/opt/reemco/scripts/restore-drill.sh", mode: "0755" }
        - { src: "scripts/assert-containers.sh", dest: "/opt/reemco/scripts/assert-containers.sh", mode: "0755" }
        - { src: "scripts/docker-user-firewall.sh", dest: "/opt/reemco/scripts/docker-user-firewall.sh", mode: "0755" }
      notify: reconcile stack

    # Secrets are injected by the operator (or a secrets manager) into
    # /etc/reemco/app.env — never committed, never baked into the image.
    - name: Seed env files from examples only when absent
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ reemco_user }}"
        mode: "{{ item.mode }}"
        force: false
      loop:
        - { src: "app.env.example", dest: "/etc/reemco/app.env", mode: "0640" }
        - { src: "release.env.example", dest: "/etc/reemco/release.env", mode: "0640" }

    - name: Image tag file must exist before the first deploy
      ansible.builtin.copy:
        dest: /etc/reemco/image-tag.env
        owner: root
        group: "{{ reemco_user }}"
        mode: "0640"
        force: false
        content: |
          # Written by deploy.sh. Do not hand-edit.
          REEMCO_IMAGE_TAG=0000000000000000000000000000000000000000

    - name: Health-check + backup timers and the DOCKER-USER firewall unit
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../systemd/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - reemco-health.service
        - reemco-health.timer
        - reemco-backup.service
        - reemco-backup.timer
        - reemco-docker-user-firewall.service
      notify: reload systemd

    - name: Enable timers and the DOCKER-USER firewall unit
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
        daemon_reload: true
      loop:
        - reemco-health.timer
        - reemco-backup.timer
        # REEA-1087 (F9) — applies the DOCKER-USER allow-list now and re-applies
        # it on every docker restart (PartOf=docker.service).
        - reemco-docker-user-firewall.service

    - name: UFW default deny inbound, allow only 80/443 (plus SSH below)
      ansible.builtin.command:
        cmd: "ufw {{ item }}"
      loop:
        - default deny incoming
        - default allow outgoing
        - allow 80/tcp comment http
        - allow 443/tcp comment https
      changed_when: false

    # REEA-1087 (F9) — SSH source allowlist. With reemco_ssh_allow_from set, only
    # that CIDR may reach 22 and the world-open rule is removed. Both commands are
    # idempotent (ufw skips an existing rule; deleting an absent rule is tolerated
    # by failed_when: false). Never leave 22 closed: the from-rule is added first.
    - name: Allow SSH from the admin/office/VPN CIDR only (F9)
      ansible.builtin.command:
        cmd: "ufw allow from {{ reemco_ssh_allow_from }} to any port 22 proto tcp comment ssh"
      when: reemco_ssh_allow_from | length > 0
      changed_when: false

    - name: Remove the world-open SSH rule once the allowlist is configured (F9)
      ansible.builtin.command:
        cmd: "ufw delete allow 22/tcp"
      when: reemco_ssh_allow_from | length > 0
      changed_when: false
      failed_when: false

    - name: SSH stays Anywhere until the CIDR is known (F9 explicit decision)
      ansible.builtin.command:
        cmd: "ufw allow 22/tcp comment ssh"
      when: reemco_ssh_allow_from | length == 0
      changed_when: false

    - name: Enable UFW
      ansible.builtin.command:
        cmd: "ufw --force enable"
      changed_when: false
      changed_when: false

    - name: Chrony is syncing (26.04 delta #3 — NTP must exist)
      ansible.builtin.command: chronyc tracking
      register: chrony_status
      changed_when: false
      failed_when: false

    - name: Report time sync state
      ansible.builtin.debug:
        msg: "{{ chrony_status.stdout_lines | default(['chronyc unavailable']) }}"

  handlers:
    # REEA-1062 — validate before reload. `sshd -t` is a syntax/semantic check
    # of the on-disk config; `set -e` stops the handler before the reload if it
    # fails, so the running sshd keeps the last good config (Rollback Path).
    - name: validate and reload sshd
      ansible.builtin.shell: |
        set -euo pipefail
        sshd -t
        systemctl reload ssh
      changed_when: false

    - name: validate and reload fail2ban
      ansible.builtin.shell: |
        set -euo pipefail
        fail2ban-client -t
        fail2ban-client reload
      changed_when: false

    - name: restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted

    - name: reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # Only fires when compose/Caddy changed, and only if a tag is already
    # deployed — it re-reads the existing tag, never a new one.
    - name: reconcile stack
      ansible.builtin.command:
        cmd: docker compose -f /opt/reemco/compose.prod.yml --env-file /etc/reemco/release.env --env-file /etc/reemco/image-tag.env up -d --remove-orphans
        chdir: /opt/reemco

# REEA-1062 — regression test. This play runs AFTER the provisioning play, so
# that play's handlers have already validated and reloaded sshd/fail2ban. It
# fails the run if the effective config drifts from the declared drop-in, which
# is the whole point: a green playbook run is evidence, not just "files copied".
#
# Skipped under --check: handlers do not reload services in check mode, so the
# running sshd/fail2ban would still report the pre-change state. Use --check for
# the change plan, then a real apply for the runtime assertions.
- name: Assert SSH/fail2ban hardening is effective
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify effective hardening (real apply only)
      when: not ansible_check_mode
      block:
        - name: Read effective sshd configuration
          ansible.builtin.command: sshd -T
          register: reemco_sshd_effective
          changed_when: false
          check_mode: false

        - name: Effective sshd matches the declared drop-in
          ansible.builtin.assert:
            that:
              - "'permitrootlogin no' in reemco_sshd_effective.stdout_lines"
              - "'x11forwarding no' in reemco_sshd_effective.stdout_lines"
              - "'maxauthtries 4' in reemco_sshd_effective.stdout_lines"
              - "'passwordauthentication no' in reemco_sshd_effective.stdout_lines"
              - "'pubkeyauthentication yes' in reemco_sshd_effective.stdout_lines"
            fail_msg: >-
              Effective sshd does not match
              /etc/ssh/sshd_config.d/99-reea1044.conf. Got:
              {{ reemco_sshd_effective.stdout_lines
                 | select('match', '^(permitrootlogin|x11forwarding|maxauthtries|passwordauthentication|pubkeyauthentication) ')
                 | list }}

        - name: sshd jail is running
          ansible.builtin.command: fail2ban-client status sshd
          changed_when: false
          check_mode: false

        - name: Read effective fail2ban sshd jail settings
          ansible.builtin.command: "fail2ban-client get sshd {{ item }}"
          loop:
            - bantime
            - maxretry
            - findtime
          register: reemco_f2b
          changed_when: false
          check_mode: false

        - name: Jail matches declared 4 retries / 1h ban / 10m window
          ansible.builtin.assert:
            that:
              - reemco_f2b.results[0].stdout | trim == '3600'
              - reemco_f2b.results[1].stdout | trim == '4'
              - reemco_f2b.results[2].stdout | trim == '600'
            fail_msg: >-
              fail2ban sshd jail does not match
              /etc/fail2ban/jail.d/sshd.local. Got bantime/maxretry/findtime =
              {{ reemco_f2b.results | map(attribute='stdout') | map('trim') | list }}.

        - name: /etc/reemco is traversable by the ubuntu automation user
          ansible.builtin.stat:
            path: /etc/reemco
          register: reemco_etc_stat

        - name: /etc/reemco mode allows reading NOTES.md
          ansible.builtin.assert:
            that:
              - reemco_etc_stat.stat.mode == '0755'
            fail_msg: >-
              /etc/reemco is {{ reemco_etc_stat.stat.mode }}, expected 0755;
              /etc/reemco/NOTES.md is unreadable to the ubuntu automation user.

        # REEA-1087 (F9) — regression test for the enforced ingress surface. A
        # green playbook run must mean the DOCKER-USER allow-list is live, not
        # merely that the script and unit were copied.
        - name: Read DOCKER-USER rules (v4)
          ansible.builtin.command: iptables -S DOCKER-USER
          register: reemco_du4
          changed_when: false
          check_mode: false

        - name: Read DOCKER-USER rules (v6)
          ansible.builtin.command: ip6tables -S DOCKER-USER
          register: reemco_du6
          changed_when: false
          check_mode: false

        - name: Read the firewall unit state
          ansible.builtin.command: systemctl is-active reemco-docker-user-firewall.service
          register: reemco_fw_unit
          changed_when: false
          failed_when: false
          check_mode: false

        - name: DOCKER-USER carries the ingress allow-list on v4 and v6
          ansible.builtin.assert:
            that:
              - "'-j REEMCO-DOCKER-INGRESS' in reemco_du4.stdout"
              - "'-j REEMCO-DOCKER-INGRESS' in reemco_du6.stdout"
              - reemco_fw_unit.stdout | trim == 'active'
            fail_msg: >-
              DOCKER-USER does not carry the Reemco allow-list (published ports
              would be UFW-exempt). v4: {{ reemco_du4.stdout_lines }};
              v6: {{ reemco_du6.stdout_lines }};
              unit: {{ reemco_fw_unit.stdout | trim }}.
